  - id: news18
    name: News18
    type: news_sitemap
    url: https://www.news18.com/commonfeeds/v1/eng/sitemap/google-news/today.xml
    headers: *default_headers

  # Answered 403 to a direct request on 2026-09-06. Set a proxy to use it.
